stages:
  - lint
  - test
  - build

default:
  tags:
    - dev-shell
  before_script:
    - node --version
    - npm --version
    - npm ci --cache .npm --prefer-offline

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

lint:
  stage: lint
  script:
    - npm run lint

test:
  stage: test
  script:
    - npm test

build:
  stage: build
  script:
    - npm run build
  artifacts:
    name: "$CI_PROJECT_NAME-$CI_COMMIT_SHORT_SHA"
    paths:
      - dist/
    expire_in: 7 days
