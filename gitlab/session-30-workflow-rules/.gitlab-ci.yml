workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

    - if: '$CI_COMMIT_TAG'

    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never

    - if: '$CI_COMMIT_BRANCH'

    - when: never

default:
  tags:
    - dev-shell

stages:
  - inspect
  - test
  - build
  - deploy

show_pipeline_context:
  stage: inspect
  script:
    - echo "CI_PIPELINE_SOURCE=${CI_PIPELINE_SOURCE:-EMPTY}"
    - echo "CI_COMMIT_BRANCH=${CI_COMMIT_BRANCH:-EMPTY}"
    - echo "CI_COMMIT_TAG=${CI_COMMIT_TAG:-EMPTY}"
    - echo "CI_DEFAULT_BRANCH=${CI_DEFAULT_BRANCH:-EMPTY}"
    - echo "CI_OPEN_MERGE_REQUESTS=${CI_OPEN_MERGE_REQUESTS:-EMPTY}"
    - echo "CI_MERGE_REQUEST_IID=${CI_MERGE_REQUEST_IID:-EMPTY}"
    - echo "CI_COMMIT_SHORT_SHA=${CI_COMMIT_SHORT_SHA:-EMPTY}"

test_app:
  stage: test
  script:
    - echo "Running application tests..."
    - test -f app.txt
    - grep -q "GitLab workflow rules lab" app.txt
    - echo "Tests passed."

build_app:
  stage: build
  script:
    - echo "Building application..."
    - mkdir -p dist
    - cp app.txt dist/app.txt
    - echo "Build completed."
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

deploy_app:
  stage: deploy
  script:
    - echo "Production deployment would run here."
    - echo "Branch=${CI_COMMIT_BRANCH}"
    - echo "SHA=${CI_COMMIT_SHORT_SHA}"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
