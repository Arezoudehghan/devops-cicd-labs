stages:
  - build
  - security
  - push

variables:
  IMAGE_NAME: "cicd-app"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
  TRIVY_CACHE_DIR: ".trivycache"

docker_build:
  stage: build
  tags:
    - dev-shell

  script:
    - docker build -t "$IMAGE_NAME:$IMAGE_TAG" .

container_scan:
  stage: security
  tags:
    - dev-shell

  script:
    - trivy image --cache-dir "$TRIVY_CACHE_DIR" --format json --output trivy-report.json --exit-code 0 "$IMAGE_NAME:$IMAGE_TAG"
    - trivy image --cache-dir "$TRIVY_CACHE_DIR" --severity HIGH,CRITICAL --exit-code 1 "$IMAGE_NAME:$IMAGE_TAG"

  cache:
    paths:
      - .trivycache/

  artifacts:
    when: always
    paths:
      - trivy-report.json
    expire_in: 7 days

docker_push:
  stage: push
  tags:
    - dev-shell

  script:
    - docker tag "$IMAGE_NAME:$IMAGE_TAG" "$NEXUS_REGISTRY/$IMAGE_NAME:$IMAGE_TAG"
    - printf '%s' "$NEXUS_PASSWORD" | docker login "$NEXUS_REGISTRY" -u "$NEXUS_USERNAME" --password-stdin
    - docker push "$NEXUS_REGISTRY/$IMAGE_NAME:$IMAGE_TAG"
    - docker logout "$NEXUS_REGISTRY"
