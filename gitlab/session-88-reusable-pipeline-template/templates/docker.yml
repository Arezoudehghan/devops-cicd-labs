.docker_build_template:
  stage: build

  tags:
    - dev-shell

  before_script:
    - echo "Checking Docker..."
    - docker version

  script:
    - echo "Building $IMAGE_NAME"
    - docker build -t "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA" .
    - docker image inspect "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA"
