stages:
  - security
  - test
  - build

variables:
  GIT_DEPTH: "0"

gitleaks_scan:
  stage: security
  tags:
    - dev-shell
  script:
    - docker pull ghcr.io/gitleaks/gitleaks:v8.30.1
    - >
      docker run --rm
      --user "$(id -u):$(id -g)"
      -v "$CI_PROJECT_DIR:/repo"
      -w /repo
      ghcr.io/gitleaks/gitleaks:v8.30.1
      git
      --redact
      --verbose
      .
  allow_failure: false

test:
  stage: test
  tags:
    - dev-shell
  script:
    - echo "Running tests"

build:
  stage: build
  tags:
    - dev-shell
  script:
    - echo "Building application"
