stages:
  - test
  - build
  - security
  - deploy

default:
  tags:
    - dev-shell

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
    - when: never

push_job:
  stage: test
  script:
    - echo "Pipeline source: $CI_PIPELINE_SOURCE"
    - echo "Push pipeline job is running"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'

nightly_job:
  stage: build
  script:
    - echo "Pipeline source: $CI_PIPELINE_SOURCE"
    - echo "Schedule type: $SCHEDULE_TYPE"
    - echo "Running nightly job"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_TYPE == "nightly"'

scheduled_security_scan:
  stage: security
  script:
    - echo "Pipeline source: $CI_PIPELINE_SOURCE"
    - echo "Schedule type: $SCHEDULE_TYPE"
    - echo "Running scheduled security scan"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_TYPE == "security"'

external_trigger_job:
  stage: deploy
  script:
    - echo "Pipeline started by external trigger"
    - echo "Deploy environment: $DEPLOY_ENV"
    - echo "Application version: $APP_VERSION"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
