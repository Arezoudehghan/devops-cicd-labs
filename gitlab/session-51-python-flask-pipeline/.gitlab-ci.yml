stages:
  - install
  - lint
  - test
  - build

default:
  tags:
    - dev-shell

  cache:
    key:
      files:
        - requirements.txt
        - requirements-dev.txt

    paths:
      - .cache/pip/

    policy: pull-push

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  VENV_DIR: "$CI_PROJECT_DIR/.venv"

  APP_ENV: "ci"

  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"


.python_setup:
  before_script:
    - rm -rf "$VENV_DIR"
    - python3 -m venv "$VENV_DIR"
    - $VENV_DIR/bin/python -m pip --version


install_dependencies:
  stage: install

  extends: .python_setup

  script:
    - $VENV_DIR/bin/python -m pip install -r requirements.txt -r requirements-dev.txt
    - $VENV_DIR/bin/python -m pip check
    - $VENV_DIR/bin/python -m pip freeze > installed-packages.txt

  artifacts:
    paths:
      - installed-packages.txt

    expire_in: 1 week


lint:
  stage: lint

  extends: .python_setup

  needs:
    - job: install_dependencies
      artifacts: false

  script:
    - $VENV_DIR/bin/python -m pip install -r requirements.txt -r requirements-dev.txt
    - $VENV_DIR/bin/python -m ruff check .


test:
  stage: test

  extends: .python_setup

  needs:
    - job: lint
      artifacts: false

  script:
    - $VENV_DIR/bin/python -m pip install -r requirements.txt -r requirements-dev.txt
    - APP_ENV=testing $VENV_DIR/bin/pytest -q --junitxml=report.xml

  artifacts:
    when: always

    paths:
      - report.xml

    reports:
      junit: report.xml

    expire_in: 1 week


build:
  stage: build

  extends: .python_setup

  needs:
    - job: test
      artifacts: false

  script:
    - $VENV_DIR/bin/python -m pip install -r requirements.txt

    - |
      set -eu

      rm -rf release dist
      mkdir -p release dist

      cp app.py requirements.txt release/

      export APP_VERSION="$CI_COMMIT_SHORT_SHA"

      HEALTH_PORT="$($VENV_DIR/bin/python -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')"

      $VENV_DIR/bin/gunicorn \
        --chdir release \
        --bind "127.0.0.1:${HEALTH_PORT}" \
        app:app > gunicorn.log 2>&1 &

      APP_PID=$!

      trap 'kill "$APP_PID" 2>/dev/null || true' EXIT

      HEALTH_OK=0

      for attempt in $(seq 1 20); do
        if curl --fail --silent \
          "http://127.0.0.1:${HEALTH_PORT}/health" > health.json; then

          HEALTH_OK=1
          break
        fi

        sleep 1
      done

      if [ "$HEALTH_OK" -ne 1 ]; then
        echo "Healthcheck failed"
        cat gunicorn.log
        exit 1
      fi

      grep -q '"status":"ok"' health.json

      kill "$APP_PID"
      wait "$APP_PID" 2>/dev/null || true
      trap - EXIT

      tar -czf \
        "dist/${CI_PROJECT_NAME}-${CI_COMMIT_SHORT_SHA}.tar.gz" \
        -C release .

      sha256sum \
        "dist/${CI_PROJECT_NAME}-${CI_COMMIT_SHORT_SHA}.tar.gz" \
        > "dist/${CI_PROJECT_NAME}-${CI_COMMIT_SHORT_SHA}.tar.gz.sha256"

  artifacts:
    name: "${CI_PROJECT_NAME}-${CI_COMMIT_SHORT_SHA}"

    paths:
      - dist/
      - health.json

    expire_in: 1 week
