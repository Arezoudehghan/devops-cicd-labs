stages:
  - lint
  - test
  - security
  - build
  - scan
  - push
  - deploy

variables:
  REGISTRY: "192.168.94.90:8085"
  IMAGE_NAME: "$REGISTRY/$CI_PROJECT_NAME"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"

lint:
  stage: lint
  tags:
    - dev-shell
  script:
    - python3 -m pip install flake8
    - flake8 .

unit_test:
  stage: test
  tags:
    - dev-shell
  script:
    - python3 -m pip install -r requirements.txt
    - python3 -m pip install pytest
    - pytest

secret_scan:
  stage: security
  tags:
    - dev-shell
  script:
    - gitleaks git --redact --report-format json --report-path gitleaks-report.json .
  artifacts:
    when: always
    paths:
      - gitleaks-report.json
    expire_in: 7 days

docker_build:
  stage: build
  tags:
    - dev-shell
  script:
    - docker build -t "$IMAGE_NAME:$IMAGE_TAG" .
    - docker image inspect "$IMAGE_NAME:$IMAGE_TAG"

container_scan:
  stage: scan
  tags:
    - dev-shell
  script:
    - trivy image --severity HIGH,CRITICAL --format json --output trivy-report.json "$IMAGE_NAME:$IMAGE_TAG"
    - trivy image --severity HIGH,CRITICAL --exit-code 1 "$IMAGE_NAME:$IMAGE_TAG"
  artifacts:
    when: always
    paths:
      - trivy-report.json
    expire_in: 7 days

push_image:
  stage: push
  tags:
    - dev-shell
  script:
    - printf '%s' "$NEXUS_PASSWORD" | docker login "$REGISTRY" -u "$NEXUS_USERNAME" --password-stdin
    - docker push "$IMAGE_NAME:$IMAGE_TAG"
    - docker logout "$REGISTRY"

deploy:
  stage: deploy
  tags:
    - dev-shell
  script:
    - eval "$(ssh-agent -s)"
    - chmod 600 "$SSH_PRIVATE_KEY"
    - ssh-add "$SSH_PRIVATE_KEY"
    - mkdir -p ~/.ssh
    - cp "$SSH_KNOWN_HOSTS" ~/.ssh/known_hosts
    - |
      ssh deploy@192.168.94.91 "
        docker pull '$IMAGE_NAME:$IMAGE_TAG' &&
        (docker stop devsecops-app 2>/dev/null || true) &&
        (docker rm devsecops-app 2>/dev/null || true) &&
        docker run -d \
          --name devsecops-app \
          --restart unless-stopped \
          -p 8088:5000 \
          '$IMAGE_NAME:$IMAGE_TAG'
      "
