stages:
  - test
  - build
  - verify
  - release

test:
  stage: test
  tags:
    - dev-shell

  script:
    - mkdir -p reports
    - python3 -m pytest --junitxml=reports/junit.xml

  artifacts:
    when: always
    name: "${CI_PROJECT_NAME}-test-${CI_PIPELINE_ID}"
    paths:
      - reports/junit.xml
    reports:
      junit: reports/junit.xml
    expire_in: 7 days

build:
  stage: build
  tags:
    - dev-shell

  needs:
    - job: test
      artifacts: false

  script:
    - rm -rf dist build-meta
    - mkdir -p dist build-meta
    - tar --exclude='.git' --exclude='.venv' --exclude='dist' --exclude='reports' --exclude='build-meta' -czf "dist/${CI_PROJECT_NAME}-${CI_COMMIT_SHORT_SHA}.tar.gz" .
    - sha256sum "dist/${CI_PROJECT_NAME}-${CI_COMMIT_SHORT_SHA}.tar.gz" > build-meta/SHA256SUMS
    - |
      cat > build-meta/build-info.txt <<EOF
      PROJECT=${CI_PROJECT_NAME}
      PIPELINE_ID=${CI_PIPELINE_ID}
      JOB_ID=${CI_JOB_ID}
      COMMIT_SHA=${CI_COMMIT_SHA}
      COMMIT_SHORT_SHA=${CI_COMMIT_SHORT_SHA}
      REF=${CI_COMMIT_REF_NAME}
      BUILT_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
      EOF

  artifacts:
    name: "${CI_PROJECT_NAME}-${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}-${CI_PIPELINE_ID}"
    paths:
      - dist/
      - build-meta/
    expire_in: 14 days

verify_artifact:
  stage: verify
  tags:
    - dev-shell

  needs:
    - job: build
      artifacts: true

  script:
    - ls -lah dist/
    - ls -lah build-meta/
    - cat build-meta/build-info.txt
    - sha256sum -c build-meta/SHA256SUMS

publish_release:
  stage: release
  tags:
    - dev-shell

  needs:
    - job: build
      artifacts: true

  rules:
    - if: '$CI_COMMIT_TAG'

  script:
    - sha256sum -c build-meta/SHA256SUMS
    - |
      FILE="dist/${CI_PROJECT_NAME}-${CI_COMMIT_SHORT_SHA}.tar.gz"
      FILE_NAME=$(basename "$FILE")

      curl --fail-with-body --location \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file "$FILE" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${CI_PROJECT_NAME}/${CI_COMMIT_TAG}/${FILE_NAME}"
